<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Castle Walkthrough</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #000; overflow: hidden; }
  canvas { display: block; }

  #start {
    position: fixed; inset: 0;
    background: #111;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    color: #fff; font-family: monospace;
    cursor: pointer; z-index: 10;
  }
  #start h1 { font-size: 28px; margin-bottom: 16px; }
  #start p  { color: #888; font-size: 14px; line-height: 2; }
  #start button {
    margin-top: 24px; padding: 10px 30px;
    background: #333; color: #fff;
    border: 1px solid #666; font-size: 16px;
    font-family: monospace; cursor: pointer;
  }
  #start button:hover { background: #444; }
  #start button:disabled { opacity: 0.4; cursor: default; }

  #levels { display: none; margin-top: 8px; gap: 16px; flex-wrap: wrap; justify-content: center; padding: 0 16px; }
  #levels a {
    display: block; width: 260px; padding: 18px 20px;
    background: #1c1c1c; border: 1px solid #555; color: #fff;
    text-decoration: none; font-family: monospace; text-align: left;
  }
  #levels a:hover, #levels a:focus { background: #2a2a2a; border-color: #6cf; }
  #levels b { display: block; font-size: 17px; margin-bottom: 8px; }
  #levels span { color: #999; font-size: 12px; line-height: 1.6; }
  #back { margin-top: 18px; color: #777; font-family: monospace; font-size: 12px; }

  #loadbar {
    width: 200px; height: 4px; background: #333;
    margin-top: 16px; border-radius: 2px; overflow: hidden;
  }
  #loadfill {
    height: 100%; width: 0%; background: #6cf;
    transition: width 0.2s;
  }

  #hint {
    position: fixed; bottom: 16px; left: 50%;
    transform: translateX(-50%);
    color: #555; font-family: monospace; font-size: 12px;
    pointer-events: none;
  }

  .joy {
    position: fixed; bottom: 30px;
    width: 110px; height: 110px; border-radius: 50%;
    background: rgba(255,255,255,0.07);
    border: 1px solid rgba(255,255,255,0.2);
    display: none; touch-action: none;
  }
  #jL { left: 24px; }
  #jR { right: 24px; }
  .knob {
    position: absolute; width: 44px; height: 44px;
    border-radius: 50%; top: 50%; left: 50%;
    transform: translate(-50%,-50%);
    background: rgba(255,255,255,0.25);
    pointer-events: none;
  }
</style>
</head>
<body>

<div id="start">
  <h1 id="title">Castle Walkthrough</h1>
  <div id="levels"></div>
  <p id="controls">
    W / A / S / D — Move<br>
    Mouse — Look around<br>
    ESC — Release mouse<br>
    <br>
    <em style="color:#555">Mobile: dual joysticks appear automatically</em>
  </p>
  <div id="loadbar"><div id="loadfill"></div></div>
  <button id="startBtn" disabled onclick="begin()">Loading…</button>
  <a id="back" href="?">&larr; Choose another level</a>
</div>

<div id="hint">WASD to move · Mouse to look · ESC to release</div>

<div class="joy" id="jL"><div class="knob" id="kL"></div></div>
<div class="joy" id="jR"><div class="knob" id="kR"></div></div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

// ── Levels ────────────────────────────────────────────
// Add a level by dropping its GLB next to this file and listing it here.
// A GLB may contain: meshes named COL_* (invisible collision geometry) and
// an empty named "Spawn" (player start + facing). Both are optional.
const LEVELS = {
  clubhouse: {
    title: 'Clubhouse Castle',
    file: 'ClubhouseCastle.glb',
    blurb: 'Gatehouse and drawbridge, courtyard fighting pit, great hall, throne room, kitchen, armory and forge, tavern cellar, guest rooms, battlements and a spiral-stair tower.',
    sky: 0x9fc6ea, sun: 2.4, sunColor: 0xfff1dc, hemi: 0.9, hemiSky: 0xcfe4ff, hemiGround: 0x6f6450, ambient: 0.25,
  },
  castle: {
    title: 'Castle',
    file: 'Castle.glb',
    blurb: 'The original torch-lit castle level.',
    sky: 0x1a1a2e, sun: 0.8, sunColor: 0xffffff, hemi: 0.2, hemiSky: 0x1a1a2e, hemiGround: 0x556633, ambient: 0.1,
  },
};
const params = new URLSearchParams(location.search);
const FLY = params.has('fly');
const levelId = params.get('level');
const level = LEVELS[levelId] || null;
const env = level || LEVELS.castle;

if (level) {
  document.getElementById('title').textContent = level.title;
  document.title = level.title + ' · Walkthrough';
} else {
  // No level chosen yet: show the picker, load nothing.
  const list = document.getElementById('levels');
  for (const [id, l] of Object.entries(LEVELS)) {
    const a = document.createElement('a');
    a.href = '?level=' + id;
    const b = document.createElement('b');
    b.textContent = l.title;
    const sp = document.createElement('span');
    sp.textContent = l.blurb;
    a.append(b, sp);
    list.appendChild(a);
  }
  list.style.display = 'flex';
  document.getElementById('title').textContent = 'Choose a level';
  for (const id of ['controls', 'loadbar', 'startBtn', 'back']) {
    document.getElementById(id).style.display = 'none';
  }
}

// ── Renderer ──────────────────────────────────────────
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.0;
document.body.appendChild(renderer.domElement);

// ── Scene ─────────────────────────────────────────────
const scene = new THREE.Scene();
scene.background = new THREE.Color(env.sky);
scene.fog = new THREE.FogExp2(env.sky, 0.015);

// ── Camera ────────────────────────────────────────────
const camera = new THREE.PerspectiveCamera(75, innerWidth / innerHeight, 0.1, 2000);
camera.position.set(0, 1.7, 5);

// ── Lights ────────────────────────────────────────────
const sun = new THREE.DirectionalLight(env.sunColor, env.sun);
sun.position.set(30, 50, 30);
sun.castShadow = true;
sun.shadow.mapSize.set(4096, 4096);
sun.shadow.camera.near = 0.5;
sun.shadow.camera.far = 200;
sun.shadow.bias = -0.0005;
sun.shadow.normalBias = 0.02;
sun.shadow.camera.left = -60;
sun.shadow.camera.right = 60;
sun.shadow.camera.top = 60;
sun.shadow.camera.bottom = -60;
scene.add(sun);

const hemi = new THREE.HemisphereLight(env.hemiSky, env.hemiGround, env.hemi);
scene.add(hemi);

scene.add(new THREE.AmbientLight(0xffffff, env.ambient));

// ── Load GLB Model ───────────────────────────────────
const loader = new GLTFLoader();
const collisionMeshes = [];
const torchLights = [];
let modelLoaded = false;

if (level) loader.load(
  level.file,
  (gltf) => {
    const model = gltf.scene;

    // Dedicated collision geometry: anything named COL_* (or inside such a node).
    // It is never drawn; when present, it is the only thing the player collides with.
    const dedicated = [];
    model.traverse((child) => {
      if (!child.isMesh) return;
      for (let o = child; o && o !== model; o = o.parent) {
        if (o.name.startsWith('COL_')) {
          child.visible = false;
          child.userData.collisionOnly = true;
          dedicated.push(child);
          break;
        }
      }
    });
    collisionMeshes.push(...dedicated);

    // Enable shadows on all meshes and collect for collision
    model.traverse((child) => {
      if (child.isMesh && !child.userData.collisionOnly) {
        child.castShadow = true;
        child.receiveShadow = true;
        // Skip flame/fire meshes from collision
        const name = child.name.toLowerCase();
        if (!dedicated.length && !name.includes('flame') && !name.includes('fire') && !name.includes('particle')) {
          collisionMeshes.push(child);
        }
      }
      // Configure point lights from GLB (torches via KHR_lights_punctual)
      if (child.isPointLight) {
        child.decay = 2;
        child.castShadow = false;
        if (!child.distance || child.distance === 0) child.distance = 15;
        child.intensity = Math.min(child.intensity, 50);
        torchLights.push(child);
      }
      if (child.isSpotLight) {
        child.decay = 2;
        child.castShadow = false;
        if (!child.distance || child.distance === 0) child.distance = 20;
        child.intensity = Math.min(child.intensity, 50);
        torchLights.push(child);
      }
    });

    scene.add(model);

    // Compute bounding box to position camera
    const box = new THREE.Box3().setFromObject(model);
    const center = box.getCenter(new THREE.Vector3());
    const size = box.getSize(new THREE.Vector3());

    // Scale camera far plane and ray distances to level size
    const maxDim = Math.max(size.x, size.y, size.z);
    camera.far = Math.max(500, maxDim * 4);
    camera.updateProjectionMatrix();
    rayHeight = Math.max(50, size.y * 2);
    rayFar = Math.max(500, size.y * 4);

    // Adjust shadow camera to cover the model
    sun.shadow.camera.left = -maxDim;
    sun.shadow.camera.right = maxDim;
    sun.shadow.camera.top = maxDim;
    sun.shadow.camera.bottom = -maxDim;
    sun.shadow.camera.far = maxDim * 3;
    sun.shadow.camera.updateProjectionMatrix();
    sun.position.set(center.x + maxDim * 0.5, center.y + maxDim, center.z + maxDim * 0.5);
    sun.target.position.copy(center);
    scene.add(sun.target);

    // Start at the level's "Spawn" marker if it has one, else on the ground plane
    // outside the structure. ?pos=x,y,z,yaw,pitch (degrees) overrides both.
    floorY = box.min.y;
    const spawn = model.getObjectByName('Spawn');
    if (spawn) {
      model.updateMatrixWorld(true);
      const p = spawn.getWorldPosition(new THREE.Vector3());
      const dir = new THREE.Vector3(0, 0, -1).applyQuaternion(spawn.getWorldQuaternion(new THREE.Quaternion()));
      camera.position.set(p.x, p.y + PLAYER_HEIGHT, p.z);
      yaw = Math.atan2(-dir.x, -dir.z);
    } else {
      camera.position.set(center.x, box.min.y + PLAYER_HEIGHT, center.z + size.z * 0.3);
    }
    const pos = (params.get('pos') || '').split(',').map(Number);
    if (pos.length >= 3 && pos.every(Number.isFinite)) {
      camera.position.set(pos[0], pos[1], pos[2]);
      if (pos.length > 3) yaw = pos[3] * Math.PI / 180;
      if (pos.length > 4) pitch = pos[4] * Math.PI / 180;
    }

    // Scale movement speed to model size
    moveSpeed = Math.max(6, maxDim * 0.03);

    // Adjust fog based on model size
    scene.fog = new THREE.FogExp2(env.sky, 0.5 / maxDim);

    modelLoaded = true;

    // Enable start button
    const btn = document.getElementById('startBtn');
    btn.disabled = false;
    btn.textContent = 'Click to Start';
  },
  (progress) => {
    if (progress.total > 0) {
      const pct = (progress.loaded / progress.total) * 100;
      const mb = (progress.loaded / 1024 / 1024).toFixed(1);
      document.getElementById('loadfill').style.width = pct + '%';
      document.getElementById('startBtn').textContent =
        'Loading... ' + mb + ' MB (' + Math.round(pct) + '%)';
    }
  },
  (error) => {
    console.error('Error loading model:', error);
    document.getElementById('startBtn').textContent = 'Load Error';
  }
);

// ── Collision System (Raycasting) ────────────────────
const PLAYER_HEIGHT = 1.7;
const PLAYER_RADIUS = 0.3;
const STEP_HEIGHT = 0.4;
const GRAVITY = 20;
let velocityY = 0;
let onGround = false;
let floorY = 0;
let moveSpeed = 6;
let rayHeight = 50;
let rayFar = 500;

const raycaster = new THREE.Raycaster();

function getGroundHeight(x, z) {
  // Cast from well above the camera downward
  const rayOrigin = new THREE.Vector3(x, camera.position.y + rayHeight, z);
  raycaster.set(rayOrigin, new THREE.Vector3(0, -1, 0));
  raycaster.far = rayFar;
  const hits = raycaster.intersectObjects(collisionMeshes, false);
  // Find the highest surface below or near the camera
  for (const hit of hits) {
    if (hit.point.y <= camera.position.y + STEP_HEIGHT) {
      return hit.point.y;
    }
  }
  return floorY;
}

function canMoveTo(px, pz) {
  const origin = new THREE.Vector3(camera.position.x, camera.position.y - PLAYER_HEIGHT + STEP_HEIGHT + 0.1, camera.position.z);
  const dir = new THREE.Vector3(px - camera.position.x, 0, pz - camera.position.z);
  const dist = dir.length();
  if (dist < 0.001) return true;
  dir.normalize();

  // Cast rays at multiple heights to catch walls
  const heights = [0, PLAYER_HEIGHT * 0.5, PLAYER_HEIGHT * 0.9];
  for (const h of heights) {
    raycaster.set(
      new THREE.Vector3(camera.position.x, camera.position.y - PLAYER_HEIGHT + STEP_HEIGHT + 0.1 + h, camera.position.z),
      dir
    );
    raycaster.far = dist + PLAYER_RADIUS;
    const hits = raycaster.intersectObjects(collisionMeshes, false);
    if (hits.length > 0 && hits[0].distance < dist + PLAYER_RADIUS) {
      return false;
    }
  }
  return true;
}

// ── Input ─────────────────────────────────────────────
const keys = {};
document.addEventListener('keydown', e => keys[e.code] = true);
document.addEventListener('keyup',   e => keys[e.code] = false);

let yaw = 0, pitch = 0, locked = false, mouseDown = false;

document.addEventListener('pointerlockchange', () => {
  locked = document.pointerLockElement === renderer.domElement;
});

document.addEventListener('mousemove', e => {
  // Pointer lock mode: free mouse look
  if (locked) {
    yaw   -= e.movementX * 0.002;
    pitch -= e.movementY * 0.002;
    pitch  = Math.max(-1.3, Math.min(1.3, pitch));
    return;
  }
  // Fallback: click-drag to look
  if (mouseDown && started) {
    yaw   -= e.movementX * 0.004;
    pitch -= e.movementY * 0.004;
    pitch  = Math.max(-1.3, Math.min(1.3, pitch));
  }
});

renderer.domElement.addEventListener('mousedown', (e) => {
  mouseDown = true;
});
document.addEventListener('mouseup', () => {
  mouseDown = false;
});

// ── Touch Joysticks ───────────────────────────────────
const isTouch = 'ontouchstart' in window;
const jL = document.getElementById('jL');
const jR = document.getElementById('jR');
const kL = document.getElementById('kL');
const kR = document.getElementById('kR');

if (isTouch) {
  jL.style.display = jR.style.display = 'block';
}

const touch = { lx:0, ly:0, rx:0, ry:0, lid:null, rid:null };

function joyOffset(zone, cx, cy) {
  const r = zone.getBoundingClientRect();
  const ox = cx - r.left - r.width/2;
  const oy = cy - r.top  - r.height/2;
  const max = r.width/2 - 22;
  const len = Math.sqrt(ox*ox + oy*oy);
  const c = Math.min(len, max);
  const nx = len > 0 ? ox/len*c : 0;
  const ny = len > 0 ? oy/len*c : 0;
  return { nx, ny, fx: nx/max, fy: ny/max };
}

document.addEventListener('touchstart', e => {
  [...e.changedTouches].forEach(t => {
    if (t.clientX < innerWidth/2) touch.lid = t.identifier;
    else touch.rid = t.identifier;
  });
  if (modelLoaded && document.getElementById('start').style.display !== 'none') {
    document.getElementById('start').style.display = 'none';
    started = true;
  }
}, { passive: true });

document.addEventListener('touchmove', e => {
  [...e.changedTouches].forEach(t => {
    if (t.identifier === touch.lid) {
      const {nx,ny,fx,fy} = joyOffset(jL, t.clientX, t.clientY);
      kL.style.transform = `translate(calc(-50% + ${nx}px), calc(-50% + ${ny}px))`;
      touch.lx = fx; touch.ly = fy;
    }
    if (t.identifier === touch.rid) {
      const {nx,ny,fx,fy} = joyOffset(jR, t.clientX, t.clientY);
      kR.style.transform = `translate(calc(-50% + ${nx}px), calc(-50% + ${ny}px))`;
      touch.rx = fx; touch.ry = fy;
    }
  });
}, { passive: true });

document.addEventListener('touchend', e => {
  [...e.changedTouches].forEach(t => {
    if (t.identifier === touch.lid) {
      touch.lid = null; touch.lx = 0; touch.ly = 0;
      kL.style.transform = 'translate(-50%,-50%)';
    }
    if (t.identifier === touch.rid) {
      touch.rid = null; touch.rx = 0; touch.ry = 0;
      kR.style.transform = 'translate(-50%,-50%)';
    }
  });
}, { passive: true });

// ── Start ─────────────────────────────────────────────
let started = false;

window.begin = function() {
  if (!modelLoaded) return;
  document.getElementById('start').style.display = 'none';
  started = true;
  renderer.domElement.requestPointerLock();
};

// Click canvas to re-engage pointer lock after ESC
renderer.domElement.addEventListener('click', () => {
  if (started && !locked) {
    renderer.domElement.requestPointerLock();
  }
});

// ── Main Loop ─────────────────────────────────────────
const clock = new THREE.Clock();

function animate() {
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.05);

  if (!modelLoaded) {
    renderer.render(scene, camera);
    return;
  }

  // Touch look
  if (touch.rid !== null) {
    yaw   -= touch.rx * 0.04;
    pitch -= touch.ry * 0.03;
    pitch  = Math.max(-1.3, Math.min(1.3, pitch));
  }

  // Movement
  const speed = moveSpeed;
  const sin = Math.sin(yaw), cos = Math.cos(yaw);
  let mx = 0, mz = 0;

  if (started) {
    if (keys['KeyW'] || keys['ArrowUp'])    { mx -= sin; mz -= cos; }
    if (keys['KeyS'] || keys['ArrowDown'])  { mx += sin; mz += cos; }
    if (keys['KeyA'] || keys['ArrowLeft'])  { mx -= cos; mz += sin; }
    if (keys['KeyD'] || keys['ArrowRight']) { mx += cos; mz -= sin; }
  }

  // Touch move
  if (touch.lid !== null) {
    mx += touch.lx * cos + (-touch.ly) * (-sin);
    mz += touch.lx * (-sin) + (-touch.ly) * (-cos);
  }

  // Normalize diagonal
  const len = Math.sqrt(mx*mx + mz*mz);
  if (len > 1) { mx /= len; mz /= len; }

  const nx = camera.position.x + mx * speed * dt;
  const nz = camera.position.z + mz * speed * dt;

  // Horizontal collision (slide along walls)
  if (FLY || canMoveTo(nx, camera.position.z)) camera.position.x = nx;
  if (FLY || canMoveTo(camera.position.x, nz)) camera.position.z = nz;

  // Gravity & ground following (?fly=1: free camera, E/Q = up/down)
  const groundY = FLY ? 0 : getGroundHeight(camera.position.x, camera.position.z);
  const targetY = groundY + PLAYER_HEIGHT;

  if (FLY) {
    if (keys['KeyE']) camera.position.y += speed * dt;
    if (keys['KeyQ']) camera.position.y -= speed * dt;
  } else if (camera.position.y > targetY + 0.05) {
    velocityY -= GRAVITY * dt;
    camera.position.y += velocityY * dt;
    onGround = false;
    if (camera.position.y <= targetY) {
      camera.position.y = targetY;
      velocityY = 0;
      onGround = true;
    }
  } else {
    camera.position.y = targetY;
    velocityY = 0;
    onGround = true;
  }

  // Follow-camera shadow map (sharp shadows near player)
  const shadowRange = 30;
  sun.position.set(camera.position.x + 30, camera.position.y + 50, camera.position.z + 30);
  sun.target.position.set(camera.position.x, camera.position.y, camera.position.z);
  sun.target.updateMatrixWorld();
  sun.shadow.camera.left = -shadowRange;
  sun.shadow.camera.right = shadowRange;
  sun.shadow.camera.top = shadowRange;
  sun.shadow.camera.bottom = -shadowRange;
  sun.shadow.camera.updateProjectionMatrix();

  // Torch flicker animation
  const time = clock.elapsedTime;
  for (let i = 0; i < torchLights.length; i++) {
    const light = torchLights[i];
    if (!light._baseIntensity) light._baseIntensity = light.intensity;
    light.intensity = light._baseIntensity * (1.0 +
      0.05 * Math.sin(time * 6.0 + i * 1.7) +
      0.03 * Math.sin(time * 13.0 + i * 3.1) +
      0.02 * Math.random()
    );
  }

  // Apply camera rotation
  camera.rotation.order = 'YXZ';
  camera.rotation.y = yaw;
  camera.rotation.x = pitch;

  renderer.render(scene, camera);
}

window.addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

// Small handle for bookmarklets and automated walk tests
window.walkthrough = {
  camera, keys,
  get yaw() { return yaw; }, set yaw(v) { yaw = v; },
  get pitch() { return pitch; }, set pitch(v) { pitch = v; },
  start() { window.begin(); },
};

animate();
</script>
</body>
</html>
